name: CI

on:
  push:
  pull_request:

jobs:
  # What this job's green tick claims: lint, typecheck and test were *executed* against this
  # commit. Each is forced, so no task can be served from a cache entry — turbo's key is a content
  # hash, and a hit means "a task with these inputs passed once", which is a weaker claim than the
  # one a required check makes. The `cache: pnpm` step below stays, because it replays downloads
  # and never a verdict; only a task-result cache can make a tick a lie. A check reporting green
  # having executed nothing is the failure this repository calls "skipped is not passed"
  # (docs/DECISIONS.md, 2026-08-25). The guard asserting these lines lives in
  # packages/core/src/test-command.test.ts, and since Q-0072 this file is a declared input of
  # @quorum/core#test (packages/core/turbo.json), so editing it invalidates the very task that
  # checks it. The earlier wording here said the guard was "in no package's hashed inputs", which
  # named the wrong file: the guard has always been inside its own package. It was its SUBJECT —
  # this workflow — that nothing hashed, so a cached pass could stand over an edited job. That is
  # now closed on its own, rather than only while this job and `integrate` both force.
  workspace:
    name: workspace (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint --force
      - run: pnpm turbo run typecheck --force
      - run: pnpm turbo run test --force

  # The oracle half of "A test's verdict is a property of the commit, not of the checkout or the
  # account" (docs/decisions, 2026-08-30). Both cells run .github/scripts/git-identity-sweep.sh,
  # which is where the environment is defined — restating it here would drift from what a
  # maintainer runs, and then a developer could not reproduce what CI claims.
  #
  # Two jobs rather than two steps, because they may share no checkout: the populated cell's whole
  # premise is that pre-existing state changes a verdict, so a shared one would make the bare cell
  # depend on the other's leftovers.
  #
  # The fourth cell — a bare checkout WITH an identity present — is deliberately uncovered. A defect
  # visible only there is one where HAVING an identity breaks a test: a rarer shape, with no
  # measured instance in this repository, and covering it costs a further full run of the suite.
  git-identity-sweep-bare:
    name: git identity sweep (bare checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # It never deletes and continues: if either path is present the premise of this cell is
      # already broken, and clearing it would hide why.
      - name: assert the checkout is bare
        run: |
          for p in .harness/worktrees .quorum/runs; do
            if [ -e "$p" ]; then
              echo "::error::$p exists in a checkout this cell requires to be bare" >&2
              exit 1
            fi
          done
      - run: bash .github/scripts/git-identity-sweep.sh

  # The cell nothing covered until now, and where Q-0072's instance lived: the two gitignored
  # directories that a working checkout has and a fresh clone does not.
  git-identity-sweep-populated:
    name: git identity sweep (populated checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: populate the two directories use creates
        run: mkdir -p .harness/worktrees .quorum/runs
      - run: bash .github/scripts/git-identity-sweep.sh
