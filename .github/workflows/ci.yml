name: CI

on:
  push:
  pull_request:

jobs:
  # What this job's green tick claims: lint, typecheck and test were *executed* against this
  # commit. Each is forced, so no task can be served from a cache entry — turbo's key is a content
  # hash, and a hit means "a task with these inputs passed once", which is a weaker claim than the
  # one a required check makes. The `cache: pnpm` step below stays, because it replays downloads
  # and never a verdict; only a task-result cache can make a tick a lie. A check reporting green
  # having executed nothing is the failure this repository calls "skipped is not passed"
  # (docs/DECISIONS.md, 2026-08-25). The guard asserting these lines lives in
  # packages/core/src/test-command.test.ts, and since Q-0072 this file is a declared input of
  # @quorum/core#test (packages/core/turbo.json), so editing it invalidates the very task that
  # checks it. The earlier wording here said the guard was "in no package's hashed inputs", which
  # named the wrong file: the guard has always been inside its own package. It was its SUBJECT —
  # this workflow — that nothing hashed, so a cached pass could stand over an edited job. That is
  # now closed on its own, rather than only while this job and `integrate` both force.
  workspace:
    name: workspace (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint --force
      - run: pnpm turbo run typecheck --force
      - run: pnpm turbo run test --force

  # Q-0009's port freeze. The spike stays authoritative and green until the cutover, so none of
  # the port's fourteen children may edit spike/src — and every other ticket still may, which is
  # why this keys on branch name rather than on a role's paths. The policy lives in
  # harness/port-charter.md §3; the script reads it rather than restating it.
  #
  # The freeze has two halves and they are two jobs, because a check that skips its subject must
  # not report success (DECISIONS, 2026-08-25). The branch-scope half is live now. The freeze-SHA
  # half has no subject until a SHA is recorded in the charter, so its job is *conditioned* on one
  # existing: GitHub then renders it as skipped — grey — rather than as a green tick over a check
  # nobody ran. `port freeze (policy)` is what reads the charter and decides that.
  port-freeze-policy:
    name: port freeze (policy)
    runs-on: ubuntu-latest
    outputs:
      freeze_sha: ${{ steps.policy.outputs.freeze_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: policy
        run: bash .github/scripts/port-freeze-guard.sh
        env:
          HALF: policy

  # Deliberately not `needs: port-freeze-policy`. It parses the charter itself and uses none of
  # that job's outputs, so a dependency would only delay it — and worse, an unparseable charter
  # would *skip* this job instead of failing it. The freeze's active half should go red in that
  # case, not grey.
  port-freeze-branch-scope:
    name: port freeze (branch scope)
    runs-on: ubuntu-latest
    steps:
      # Full history: the guard needs a merge base, and it fails closed on a shallow clone
      # rather than reading an uncomputable diff as a clean one. `ref` is explicit because on a
      # pull_request the default checkout is main-merged-into-the-branch, whose merge base with
      # main is main itself — the diff would come back empty for the wrong reason and the guard
      # would report clear on a branch it had not actually examined.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
      - run: bash .github/scripts/port-freeze-guard.sh
        env:
          HALF: branch-scope
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: origin/main

  # Skipped, not passed, while the charter reads `freeze-sha: not-yet-recorded`. Once a SHA is
  # recorded this job runs on every push and verifies it: the base must hold no spike/src change
  # since the freeze point.
  port-freeze-sha:
    name: port freeze (base unchanged since the freeze SHA)
    needs: port-freeze-policy
    if: needs.port-freeze-policy.outputs.freeze_sha != 'not-yet-recorded'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/port-freeze-guard.sh
        env:
          HALF: freeze-sha
          BASE: origin/main

  spike:
    name: spike (regression suite)
    runs-on: ubuntu-latest
    steps:
      # Full history: S11.5 and S13.8 assert that frozen inputs are unchanged since a named
      # baseline commit, which a depth-1 clone does not contain — `git cat-file -e` then fails and
      # the scenario goes red for want of history rather than for a real change. Same reasoning as
      # `port freeze (branch scope)` above, which has always fetched depth 0 for its merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The suite drives the engine, which commits worktrees with the ambient git identity.
      # A bare runner has none, so the first commit would fail before a single check ran.
      - run: |
          git config --global user.email "ci@quorum.invalid"
          git config --global user.name "Quorum CI"
      - run: npm ci
        working-directory: spike
      - run: npm test
        working-directory: spike
